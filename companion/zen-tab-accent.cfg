// Zen Tab Accent Plus AutoConfig loader. First line intentionally a comment.
(() => {
  const { Services } = ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs");
  if (Services.appinfo.inSafeMode) return;
  Services.obs.addObserver(function loadCompanion(win) {
    try {
      const file = Services.dirsvc.get("ProfD", Components.interfaces.nsIFile);
      file.append("chrome");
      file.append("zen-tab-accent.uc.js");
      if (file.exists()) Services.scriptloader.loadSubScript(Services.io.newFileURI(file).spec, win, "UTF-8");
    } catch (error) { console.error("Zen Tab Accent Plus loader", error); }
  }, "browser-delayed-startup-finished");
})();
